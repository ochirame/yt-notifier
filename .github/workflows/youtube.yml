name: YouTube Notifier

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Ambil state (repo private)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STATE_REPO }}
          token: ${{ secrets.STATE_PAT }}
          path: state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jalankan notifier
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CHANNELS: ${{ vars.CHANNELS }}
        run: python notify.py

      - name: Simpan state
        if: always()
        working-directory: state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json || true
          git diff --staged --quiet || (git commit -m "sync" && git push)
